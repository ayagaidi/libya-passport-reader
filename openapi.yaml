openapi: 3.1.0
info:
  title: Libya Passport Reader API
  version: 0.3.2-dev
  description: Privacy-first API for adaptive passport preprocessing, ICAO Doc 9303 TD3 MRZ candidate scoring and validation, Arabic/English visual-zone extraction, and conservative MRZ comparison.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /api/v1/meta:
    get:
      summary: API metadata and privacy guarantees
      responses:
        '200':
          description: Metadata
  /api/v1/passport/scan:
    post:
      summary: Adaptively preprocess and scan a passport image or first page of a PDF, select the strongest TD3 MRZ candidate, extract visible fields, and compare both sources
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [passport]
              properties:
                passport:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP, or PDF. Maximum size is deployment-configurable.
      responses:
        '200':
          description: Parsed passport fields, MRZ validation, adaptive smart-scanner metadata, OCR metadata, visual-zone fields, conservative comparison results, and privacy metadata
        '422':
          description: Invalid upload or TD3 MRZ not confidently detected in any scan candidate
        '503':
          description: Required local MRZ OCR or PDF-processing dependency unavailable
  /api/v1/passport/mrz/parse:
    post:
      summary: Parse a two-line TD3 MRZ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MrzRequest'
      responses:
        '200':
          description: Parsed passport fields and check-digit validation
        '422':
          description: Invalid MRZ input
  /api/v1/passport/mrz/validate:
    post:
      summary: Validate TD3 MRZ check digits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MrzRequest'
      responses:
        '200':
          description: Check-digit validation result
components:
  schemas:
    MrzRequest:
      type: object
      required: [line1, line2]
      properties:
        line1:
          type: string
          minLength: 44
          maxLength: 44
        line2:
          type: string
          minLength: 44
          maxLength: 44

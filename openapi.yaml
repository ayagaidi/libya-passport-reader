openapi: 3.1.0
info:
  title: Libya Document Reader API
  version: 0.4.2-dev
  description: |
    Privacy-first API for Libyan passport and Civil Registry Authority document scanning. It combines OpenCV document detection, adaptive ICAO Doc 9303 TD3 MRZ validation, Arabic/English OCR, conservative Civil Registry verification signals, API-key authentication, per-client rate limiting, and an origin allowlist for browser clients.

    Supported Civil Registry Authority documents currently include **Residence Certificate (شهادة الإقامة)** and **Family Status Certificate (شهادة بالوضع العائلي)**.

    Civil Registry verification signals include QR detection/decoding, structural validation of recognized `CheckNumber` payloads, sample-calibrated template anchors, and visual blue-ink seal candidates. These signals **do not prove document authenticity** and the API does not claim issuer-database or digital-signature verification.

    Use the **Authorize** button and provide the API key issued to your client. The key is sent in the `X-API-Key` header.

    **Developer:** Aya Aljaidi  
    **GitHub:** [github.com/ayagaidi](https://github.com/ayagaidi)  
    **LinkedIn:** [Aya Aljaidi](https://www.linkedin.com/in/aya-aljaidi-a9544b208/)
  contact:
    name: Aya Aljaidi
    url: https://www.linkedin.com/in/aya-aljaidi-a9544b208/
  x-developer:
    name: Aya Aljaidi
    github: https://github.com/ayagaidi
    linkedin: https://www.linkedin.com/in/aya-aljaidi-a9544b208/
externalDocs:
  description: Libya Document Reader on GitHub
  url: https://github.com/ayagaidi/libya-passport-reader
servers:
  - url: /
    description: Current host
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /api/v1/meta:
    get:
      summary: API metadata, supported documents, security policy, verification capabilities, and privacy guarantees
      responses:
        '200':
          description: Metadata
        '401':
          description: Missing or invalid API key
        '429':
          description: Per-client API rate limit exceeded
  /api/v1/passport/scan:
    post:
      summary: Detect and rectify a passport document, evaluate image quality, adaptively select the strongest TD3 MRZ candidate, extract visible fields, and compare both sources
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [passport]
              properties:
                passport:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP, or PDF. Maximum size is deployment-configurable.
      responses:
        '200':
          description: Parsed passport fields, MRZ validation, vision and adaptive scanner metadata, OCR metadata, visual-zone fields, conservative comparison results, and privacy metadata
        '401':
          description: Missing or invalid API key
        '422':
          description: Invalid upload, severely low image quality, or TD3 MRZ not confidently detected in any scan candidate
        '429':
          description: Per-client API rate limit exceeded
        '503':
          description: Required local MRZ OCR or PDF-processing dependency unavailable
  /api/v1/civil-registry/scan:
    post:
      summary: Read a supported Libyan Civil Registry document and return structured fields plus conservative verification signals
      description: |
        Supports Residence Certificate (شهادة الإقامة) and Family Status Certificate (شهادة بالوضع العائلي).

        The response can include QR presence and recognized CheckNumber structure, expected QR position, blue-ink seal candidates, sample-calibrated template-anchor coverage, field-format consistency, and an aggregate `signal_score`.

        Raw OCR text and raw QR payloads are not returned or persisted. Verification signals are advisory only; `authenticity_verified` remains `false` unless a future trusted issuer verification integration is explicitly added.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP, or PDF. Maximum size is deployment-configurable.
      responses:
        '200':
          description: Classified civil-registry document, structured fields, family-member rows when detected, OCR confidence, QR/template/seal verification signals, vision metadata, and privacy metadata
        '401':
          description: Missing or invalid API key
        '422':
          description: Invalid upload or supported Civil Registry Authority document not confidently detected
        '429':
          description: Per-client API rate limit exceeded
        '503':
          description: Required local OCR or PDF-processing dependency unavailable
  /api/v1/passport/mrz/parse:
    post:
      summary: Parse a two-line TD3 MRZ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MrzRequest'
      responses:
        '200':
          description: Parsed passport fields and check-digit validation
        '401':
          description: Missing or invalid API key
        '422':
          description: Invalid MRZ input
        '429':
          description: Per-client API rate limit exceeded
  /api/v1/passport/mrz/validate:
    post:
      summary: Validate TD3 MRZ check digits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MrzRequest'
      responses:
        '200':
          description: Check-digit validation result
        '401':
          description: Missing or invalid API key
        '422':
          description: Invalid MRZ input
        '429':
          description: Per-client API rate limit exceeded
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Client API key issued by the deployment owner.
  schemas:
    MrzRequest:
      type: object
      required: [line1, line2]
      properties:
        line1:
          type: string
          minLength: 44
          maxLength: 44
        line2:
          type: string
          minLength: 44
          maxLength: 44

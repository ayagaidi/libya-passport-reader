name: Laravel Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Check code style
        run: vendor/bin/pint --test

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-vision.txt

      - name: Install vision dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-vision.txt

      - name: Check vision worker syntax
        run: python -m py_compile tools/passport_vision.py

      - name: Run synthetic vision tests
        run: python -m unittest discover -s tests/vision -p 'test_*.py'
